name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (tunnel, rc/tool, relay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make -C android tunnel-test rc-test
      - run: make -C relay test

  android:
    name: Kotlin unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: gomobile version
        id: xmobile
        run: echo "version=$(awk '$1 == "golang.org/x/mobile" { print $2 }' android/tunnel/go.mod)" >> "$GITHUB_OUTPUT"
      # The SDK/NDK image, cached by layer; make below reuses it instead of docker build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: android
          file: android/Dockerfile.build
          platforms: linux/amd64
          build-args: XMOBILE=${{ steps.xmobile.outputs.version }}
          tags: tunnel-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No rc.key: the AAR has no endpoints key, the debug build gets no endpoints.
      - run: make -C android -o docker-image tunnel
      - name: google-services.json stub
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "org.newvpn" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew testDebugUnitTest
        working-directory: android
