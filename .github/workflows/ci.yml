name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (tunnel, rc/tool, relay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make -C android tunnel-test rc-test adblock-test
      - run: make -C relay test

  android:
    name: Kotlin unit tests, debug and release builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: gomobile version
        id: xmobile
        run: echo "version=$(awk '$1 == "golang.org/x/mobile" { print $2 }' android/tunnel/go.mod)" >> "$GITHUB_OUTPUT"
      # The SDK/NDK image, cached by layer; make below reuses it instead of docker build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: android
          file: android/Dockerfile.build
          platforms: linux/amd64
          build-args: XMOBILE=${{ steps.xmobile.outputs.version }}
          tags: tunnel-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Stub Firebase config; fake but well-formed endpoints (TEST-NET-3) and
      # key so the release variant builds too, unsigned without a keystore.
      - name: Build config
        run: |
          cp android/app/google-services.stub.json android/app/google-services.json
          printf 'rc.key=%s\nvds.endpoints=%s\n' "$(printf '0%.0s' $(seq 64))" 'ci.invalid|203.0.113.1|443|/ci-stub-path' > android/local.properties
      - run: make -C android -o docker-image tunnel
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Release too: R8 and keep rules break only there.
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
        working-directory: android
