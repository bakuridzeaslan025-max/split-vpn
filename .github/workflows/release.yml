name: Release draft

# A tag vX.Y.Z builds an UNSIGNED release APK into a draft release. It is
# signed and published locally with `make -C android sign-release TAG=vX.Y.Z`:
# the upload key never goes to CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.secrets.outputs.ok }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches versionName
        id: version
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but versionName is $v"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - name: Secrets present
        id: secrets
        env:
          RC_KEY: ${{ secrets.RC_KEY }}
          VDS_ENDPOINTS: ${{ secrets.VDS_ENDPOINTS }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$RC_KEY" ] && [ -n "$VDS_ENDPOINTS" ] && [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No draft built::set the RC_KEY, VDS_ENDPOINTS and GOOGLE_SERVICES_JSON_B64 secrets, or use make -C android release-local publish-local"
          fi
      # make tunnel and gradle read both from local.properties.
      # integrity.project is the Firebase project number: one Cloud project.
      - name: Build config
        if: steps.secrets.outputs.ok
        env:
          RC_KEY: ${{ secrets.RC_KEY }}
          VDS_ENDPOINTS: ${{ secrets.VDS_ENDPOINTS }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          project=$(jq -r .project_info.project_number android/app/google-services.json)
          printf 'rc.key=%s\nvds.endpoints=%s\nintegrity.project=%s\n' "$RC_KEY" "$VDS_ENDPOINTS" "$project" > android/local.properties
      - if: steps.secrets.outputs.ok
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: gomobile version
        if: steps.secrets.outputs.ok
        id: xmobile
        run: echo "version=$(awk '$1 == "golang.org/x/mobile" { print $2 }' android/tunnel/go.mod)" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ok
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: android
          file: android/Dockerfile.build
          platforms: linux/amd64
          build-args: XMOBILE=${{ steps.xmobile.outputs.version }}
          tags: tunnel-builder:latest
          load: true
          cache-from: type=gha
      - if: steps.secrets.outputs.ok
        run: make -C android -o docker-image tunnel
      - if: steps.secrets.outputs.ok
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - if: steps.secrets.outputs.ok
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - if: steps.secrets.outputs.ok
        run: ./gradlew assembleRelease
        working-directory: android
      - name: APK and checksum
        if: steps.secrets.outputs.ok
        env:
          V: ${{ steps.version.outputs.name }}
        run: |
          rm android/local.properties android/app/google-services.json
          mkdir out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/split-vpn-$V-unsigned.apk"
          cd out && sha256sum "split-vpn-$V-unsigned.apk" | tee "split-vpn-$V-unsigned.apk.sha256"
      - if: steps.secrets.outputs.ok
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: out/
          if-no-files-found: error

  draft:
    needs: build
    if: needs.build.outputs.built
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: out
      # A published release is never touched: its APK is signed.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.build.outputs.version }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
                --notes "Unsigned; make -C android sign-release TAG=$GITHUB_REF_NAME" \
                "out/split-vpn-$V-unsigned.apk" "out/split-vpn-$V-unsigned.apk.sha256" ;;
            true)
              gh release upload "$GITHUB_REF_NAME" --clobber \
                "out/split-vpn-$V-unsigned.apk" "out/split-vpn-$V-unsigned.apk.sha256" ;;
            *)
              echo "::error::release $GITHUB_REF_NAME is already published, not touching it"; exit 1 ;;
          esac
