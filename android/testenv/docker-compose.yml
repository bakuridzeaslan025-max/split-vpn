# Local stand for the instrumented tests: the relay behind nginx with a
# self-signed cert, as on the VDS. The emulator reaches it at 10.0.2.2:8443.
services:
  relay:
    build:
      context: ../../relay
      dockerfile: ../android/testenv/Dockerfile.relay
    container_name: vpn-test-relay
    environment:
      - ISSUER_KEY=${ISSUER_KEY}
      - CRED_PUB=${CRED_PUB}
      - INVITES_FILE=/data/invites
    volumes:
      - ./data:/data
  nginx:
    image: nginx:alpine
    container_name: vpn-test-nginx
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
